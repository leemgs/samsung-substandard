name: Familynet Alert

on:
  schedule:
    - cron: "17 4 * * *"  # 매일 04:17 UTC = 13:17 KST (등재 시간 00:00~12:00 이후, 정각은 지연/누락이 잦아 피함)
    - cron: "10 3-9 * * 2,4"  # 화·목 03:10~09:10 UTC = 12:10~18:10 KST, 1시간 간격 (등재 직후 빠른 품절 대비)
  workflow_dispatch:
    inputs:
      test_email:
        description: "SMTP 테스트 메일만 발송"
        type: boolean
        default: false
      inspect:
        description: "읽기 전용 점검: 페이지 번호/더보기 구조와 총 개수 출력"
        type: boolean
        default: false
      baseline:
        description: "현재 일치 물품을 기준선으로만 저장 (메일 미발송)"
        type: boolean
        default: false
      baseline_categories:
        description: "baseline 과 함께: 기준선 처리할 카테고리(쉼표 구분, 예: 모니터,에어컨). 비우면 전체"
        type: string
        default: ""
      preview_mail:
        description: "현재 일치 물품 최대 3건을 미리보기 메일로 발송 (상태 저장 안 함)"
        type: boolean
        default: false
      dry_run:
        description: "메일 발송/상태 저장 없이 결과만 확인"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: familynet-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Run check
        env:
          FAMILYNET_ID: ${{ secrets.FAMILYNET_ID || vars.FAMILYNET_ID }}
          FAMILYNET_PW: ${{ secrets.FAMILYNET_PW }}
          FAMILYNET_URL: ${{ secrets.FAMILYNET_URL || vars.FAMILYNET_URL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BASELINE_CATEGORIES: ${{ inputs.baseline_categories }}
        run: |
          ARGS=""
          [ "${{ inputs.test_email }}" = "true" ] && ARGS="$ARGS --test-email"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.baseline }}" = "true" ] && ARGS="$ARGS --baseline"
          [ "${{ inputs.inspect }}" = "true" ] && ARGS="$ARGS --inspect"
          [ "${{ inputs.preview_mail }}" = "true" ] && ARGS="$ARGS --preview-mail"
          python scripts/check_items.py $ARGS

      - name: Upload debug artifacts
        if: failure() || inputs.inspect
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 1

      - name: Commit state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json docs/data/latest.json
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "chore: update alert state [skip ci]"
            # 같은 순간에 다른 push(웹앱 저장 등)와 겹쳐도 상태가 유실되지 않도록 재시도.
            # (메일 발송 후 상태 저장이 실패하면 다음 실행에서 같은 메일이 중복 발송됨)
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              echo "push 실패($i/5) — 재시도"; git rebase --abort 2>/dev/null || true; sleep $((i * 3))
            done
            [ "$ok" = 1 ] || { echo "상태 저장 push 최종 실패"; exit 1; }
          fi
