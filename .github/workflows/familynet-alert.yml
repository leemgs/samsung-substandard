name: Familynet Alert

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch:
    inputs:
      test_email:
        description: "SMTP 테스트 메일만 발송"
        type: boolean
        default: false
      dry_run:
        description: "메일 발송/상태 저장 없이 결과만 확인"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: familynet-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Run check
        env:
          FAMILYNET_ID: ${{ secrets.FAMILYNET_ID }}
          FAMILYNET_PW: ${{ secrets.FAMILYNET_PW }}
          FAMILYNET_URL: ${{ secrets.FAMILYNET_URL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          ARGS=""
          [ "${{ inputs.test_email }}" = "true" ] && ARGS="$ARGS --test-email"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python scripts/check_items.py $ARGS

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/

      - name: Commit state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json docs/data/latest.json
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "chore: update alert state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
